<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#07130F" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.6"/>
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378" />
      <stop offset="50%" stop-color="#DFBE82" />
      <stop offset="100%" stop-color="#9E782F" />
    </linearGradient>
  </defs>
  <!-- Sleek automotive streamline curve -->
  <path d="M18 58 C 30 38, 48 34, 70 38 C 78 40, 84 46, 86 54" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <!-- Signature monogram S -->
  <text x="50" y="66" font-family="'Cinzel', 'Cormorant Garamond', serif" font-size="44" font-weight="700" fill="url(#goldGradient)" text-anchor="middle">S</text>
  <circle cx="50" cy="78" r="1.5" fill="#E5C378" opacity="0.8" />
</svg>
